# Integración continua de la plataforma (constitución, principio X).
# Vive aquí por la excepción del principio XII: GitHub Actions solo lee flujos en .github/workflows/.
# No contiene lógica de la aplicación: solo ejecuta comandos dentro de tecnologia/plataforma-barberias/.
name: plataforma-barberias

on:
  push:
    branches: [main]
    paths: ["tecnologia/plataforma-barberias/**", "specs/**", ".github/workflows/plataforma-barberias.yml"]
  pull_request:
    paths: ["tecnologia/plataforma-barberias/**", "specs/**", ".github/workflows/plataforma-barberias.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecnologia/plataforma-barberias/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tecnologia/plataforma-barberias/backend/package-lock.json
      - run: npm ci
      # Escaneo de dependencias de producción desde nivel alto (004, T002, caso A: sin excepciones).
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Testcontainers usa el Docker del runner de GitHub (ubuntu-latest lo trae instalado).
      - run: npm run test:int
      - run: npm run test:arch

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecnologia/plataforma-barberias/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tecnologia/plataforma-barberias/frontend/package-lock.json
      - run: npm ci
      # Escaneo de dependencias de producción desde nivel alto (004, T002, caso B): audit-ci con las
      # excepciones de audit-ci.jsonc, cada una con su aviso y su fecha de vencimiento.
      - run: npx audit-ci --config audit-ci.jsonc
      - run: npx prettier --check .
      - run: npm run lint
      # Incluye tsc --noEmit (errores de tipos) y el build de producción de Vite.
      - run: npm run build
      - run: npm test

  # 009 (análisis A2 y M9): pruebas, formato y lint de las herramientas nuevas (scripts/, semilla/, evidencia/scripts/;
  # cada fase de 009 agrega sus carpetas) y revisión de secretos en evidencia/. Cabe en "verificar" y "probar"
  # (principio XII): sin secretos, sin base de datos y sin desplegar nada.
  herramientas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecnologia/plataforma-barberias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Desde Node 22, `node --test` recibe patrones de archivos, no carpetas.
      - run: node --test "scripts/test/*.test.mjs" "semilla/test/*.test.mjs" "evidencia/scripts/test/*.test.mjs"
      - run: npx --yes prettier@3.9.10 --check scripts semilla evidencia/scripts herramientas.eslint.config.mjs
      - run: npx --yes eslint@9.39.5 -c herramientas.eslint.config.mjs scripts semilla evidencia/scripts herramientas.eslint.config.mjs
      - run: node evidencia/scripts/revisar-secretos.mjs
