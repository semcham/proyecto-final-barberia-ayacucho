# Configuración principal de Nginx para el balanceo local (funcionalidad 006, ADR-030).
# Reemplaza la de la imagen solo para fijar un proceso de trabajo (equipo de 8 GB, research.md R12): la
# directiva no puede ir en la plantilla de conf.d ni pasarse con -g, porque la imagen ya la define.
# El balanceo está en templates/default.conf.template.

worker_processes 1;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format principal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'upstream=$upstream_addr estado_upstream=$upstream_status '
                         'tiempo=$request_time';
    access_log /var/log/nginx/access.log principal;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
